# qsafe-testbed: PMS 2.7 OSC adapter uses /a1-p/..., A1 mediator 3.2.2 serves /A1-P/v2/... (same bodies)
server {
  listen 10001;
  location /a1-p/ { rewrite ^/a1-p/(.*)$ /A1-P/v2/$1 break; proxy_pass http://10.0.3.16:10000; }
  # energy xApp KPIs (latest KPM from the DU) and A1 enforcement history, for the rApps
  location /kpm { proxy_pass http://10.0.3.20:8095/kpm; }
  location /history { proxy_pass http://10.0.3.20:8095/history; }
}
